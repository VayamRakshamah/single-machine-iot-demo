name: single-machine-iot-demo

services:
  plc-simulator:
    build: ./plc-simulator
    ports:
      - "1502:1502"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iotdemo}
      POSTGRES_USER: ${POSTGRES_USER:-iotdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iotdemo-local}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  edge-gateway:
    build: ./edge-gateway
    environment:
      PLC_HOST: plc-simulator
      PLC_PORT: 1502
      MQTT_BROKER_URI: tcp://mosquitto:1883
      EDGE_BUFFER_PATH: /data/edge-buffer.db
    volumes:
      - edge-data:/data
    ports:
      - "8082:8082"
    depends_on:
      plc-simulator:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iotdemo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-iotdemo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-iotdemo-local}
      MQTT_BROKER_URI: tcp://mosquitto:1883
      PLC_SCENARIO_URL: http://plc-simulator:8081
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  mosquitto-data:
  edge-data:
